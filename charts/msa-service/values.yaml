# ═════════════════════════════════════════════════════════════
# 차트 기본값 (모든 서비스 공통)
#  - 백엔드 4개(회원·상품·주문(결제 포함)·쿠폰)가 Spring Boot 라서, 기본값은 Spring Boot 기준으로 잡았다.
#    (값의 출처: 샘플 저장소 k8s/backend/*.yaml)
#  - 프론트(Next.js)처럼 다른 서비스는 자기 values.yaml 에서 덮어쓴다.
#  우선순위:  이 파일  <  apps/<서비스>/base/values.yaml  <  apps/<서비스>/overlays/<환경> 의 patch
# ═════════════════════════════════════════════════════════════

partOf: ecommerce             # 라벨 app.kubernetes.io/part-of 값 (6번 Prometheus 가 이 라벨로 찾음)

# ── 이미지 ───────────────────────────────────────────────────
image:
  repository: ""              # 서비스 values 에서 반드시 지정
  tag: "latest"               # ★ onprem·aws 에서는 latest 금지 (롤백 불가). 5번 CI 가 git 커밋 태그로 바꿈
  pullPolicy: IfNotPresent
imagePullSecrets: []          # Harbor(온프렘) 서비스는 apps/<서비스>/base/values.yaml 에서 harbor-pull 지정 (#21)

# ── 포트 ─────────────────────────────────────────────────────
containerPort: 8080           # 앱이 요청을 받는 포트 (서비스마다 다름: 8084~8093, 화면 3000)
managementPort: 9000          # Spring Boot 관리 포트 (헬스체크 /actuator/health, 메트릭 /actuator/prometheus)
                              # 프론트처럼 관리 포트가 없으면 null

# ── 레플리카 / 배포 방식 ─────────────────────────────────────
replicaCount: 1               # autoscaling.enabled=false 일 때만 사용
rollingUpdate:                # Deployment 의 RollingUpdate, Rollout 의 canary 둘 다 이 값을 씀
  maxSurge: 1                 # 새 Pod 를 1개 먼저 띄우고
  maxUnavailable: 0           # 새 Pod 가 Ready 되기 전엔 옛 Pod 를 안 내림 → Pod 1개여도 무중단 배포
minReadySeconds: 10           # Ready 후 10초 더 지켜보고 정상으로 인정

# ── 카나리 배포 (Argo Rollouts) ──────────────────────────────
# 팀 결정: 상품(product-service)만 Rollout, 나머지는 기본 Deployment(RollingUpdate)
# 켜면 deployment.yaml 대신 rollout.yaml 이 만들어지고,
#   <이름>-stable / <이름>-canary Service 2개가 추가되며, HPA·KEDA 대상도 Rollout 으로 바뀐다.
rollout:
  enabled: false
  httpRoute: ""               # weight 를 바꿀 HTTPRoute 이름. 비우면 서비스 이름과 같음
  # 카나리 단계 (5번과 확정). setWeight = 새 버전으로 보낼 요청 비율(%)
  #  pause: {}            → 사람이 승인할 때까지 대기 (kubectl argo rollouts promote <이름>)
  #  pause: {duration: 2m} → 2분 뒤 자동 진행
  # 마지막 단계가 끝나면 자동으로 100% 전환.
  #  onprem-main 은 이 단계 그대로 (20% 에서 멈추면 5번이 승인)
  #  onprem-dev 는 apps/product/overlays/onprem-dev 에서 pause 대신 analysis(5xx 비율)로 자동 승급·롤백 (#24)
  steps:
    - setWeight: 20
    - pause: {}
    - setWeight: 50
    - pause: { duration: 2m }

# ── 종료 처리 (무중단 핵심) ──────────────────────────────────
preStopSleepSeconds: 10       # 종료 신호 전 10초 대기 → 그동안 Service 목록에서 빠짐
terminationGracePeriodSeconds: 45   # preStop(10) + Spring Boot 가 처리 중 요청 마무리할 시간

# ── 우선순위 ─────────────────────────────────────
# 지금은 쓰지 않음 (비워 둠). 2노드라 우선순위 대신 CPU 요청값을 실제 사용에 맞춰 자원 여유로 대응 (2026-10-22 결정)
#  쓰려면 PriorityClass 를 클러스터에 먼저 만든 뒤 이름을 넣는다 (없는 이름이면 Pod 생성이 거부됨)
priorityClassName: ""

# ── 노드 장애 대비 ───────────────────────────────────────────
# ① Pod 를 노드별로 나눠 배치: Pod 2개가 한 노드(w1)에 몰리면 그 노드 장애 시 둘 다 죽는다.
#    ScheduleAnyway = "가능하면 나눠라". 남은 노드가 1대뿐이어도 Pod 를 띄울 수 있다.
#    (DoNotSchedule 로 하면 노드 1대가 죽었을 때 대체 Pod 가 Pending 으로 멈춤 → 쓰지 않음)
spread:
  enabled: true
  maxSkew: 1                  # 노드 간 Pod 개수 차이 최대 1
  whenUnsatisfiable: ScheduleAnyway
  # 교체(rollout restart·카나리) 때 예전 Pod 는 빼고 새 버전 Pod 끼리만 세어 나눈다 (T-14)
  #   pod-template-hash = Deployment, rollouts-pod-template-hash = Argo Rollout. Pod 에 없는 키는 무시된다
  #   ※ 노드가 다시 살아난 뒤 이미 몰린 Pod 를 옮겨 주지는 않는다 → 0단계처럼 Pod 를 하나 지우거나 descheduler(2번과 협의)
  matchLabelKeys:
    - pod-template-hash
    - rollouts-pod-template-hash
# ② 노드가 죽었을 때 Pod 를 다른 노드로 옮기기 전 대기 시간(초)
#    쿠버네티스 기본은 300초(5분). 30초로 줄이면 장애 감지(약 40~50초) + 30초 ≒ 1분대에 재배치 시작
#    너무 짧으면 잠깐의 네트워크 끊김에도 Pod 가 옮겨 다닌다. null 이면 기본값(300초)
nodeFailureTolerationSeconds: 30

# ── 의존 서비스 기다리기 (initContainer) ────────────────────
# 앱보다 먼저 DB 등이 열릴 때까지 기다린다. 없으면 앱이 DB 연결 실패로 죽었다 살았다 반복함
# ★ 주소는 공통 설정(ecommerce-config)의 key 이름으로 지정한다 → 환경마다 DB 주소가 달라도 자동으로 따라감
# 예) waitFor: [ { name: db, hostEnv: DB_HOST, portEnv: DB_PORT } ]
#    (주소를 고정하려면 host/port 를 직접 써도 됨: { name: x, host: x, port: 1234 })
waitFor: []
waitForImage: busybox:1.36
# 대기용 initContainer 자원. dev namespace 의 ResourceQuota 는 모든 컨테이너에 자원 값을 요구한다
waitForResources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 32Mi

# ── 설정값 주입 ──────────────────────────────────────────────
# envFrom : ConfigMap/Secret 의 모든 key 를 통째로 환경변수로 (공통 설정 ecommerce-config 등)
envFrom:
  - configMapRef:
      name: ecommerce-config  # apps/ecommerce-config 에서 관리하는 공통 설정 (DB/Kafka/Keycloak 주소)
# env : 하나씩 지정하는 환경변수 (Secret 의 특정 key, 서비스별 DB 주소 등)
#   ★ "$(DB_HOST)" 처럼 쓰면 위 envFrom 으로 들어온 값을 끼워 넣을 수 있다 (쿠버네티스 기능)
env: []
# config : 이 서비스만 쓰는 설정. 있으면 <서비스>-config ConfigMap 이 생기고 envFrom 에 자동 추가
config: {}

podAnnotations: {}

# ── 리소스 (샘플 앱 기준값) ──────────────────────────────────
# 샘플 공통 설정의 JAVA_TOOL_OPTIONS 가 힙을 200MB 로 제한하므로 512Mi 면 충분
# ★ HPA 의 CPU % 는 requests.cpu 기준. requests 가 없으면 HPA 가 동작하지 않음
# CPU 요청: 실제 사용(평소 1~5m)에 맞춰 100m. 기동·부하 땐 limits(1000m)까지 순간 사용 가능
#  (250m 일 때 dev+main 이 같은 노드에서 예약 95% → 교체·HPA·KEDA 새 Pod 가 Pending, 2026-10-23)
#  HPA 70% 기준도 이 값 기준이라 Pod 당 70m 넘게 쓰면 늘어남
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 512Mi             # 요청=상한 → 메모리 부족으로 다른 Pod 를 밀어내지 않음

# ── 보안 설정 (샘플 앱과 동일) ───────────────────────────────
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop: ["ALL"]

# ── Probe ────────────────────────────────────────────────────
# 샘플 앱과 같은 값에서 출발. 3주차에 실제 측정값으로 튜닝한다.
startupProbe:                 # 기동 확인: 10초 x 30번 = 최대 5분 기다림 (Spring Boot 는 기동이 느림)
  httpGet:
    path: /actuator/health
    port: management          # 이름으로 참조 → 관리 포트(9000)
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:               # 요청 받을 준비: 실패하면 Service 에서만 빠짐
  httpGet:
    path: /actuator/health
    port: management
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
# livenessProbe 켬 : 연습장에서 백엔드 4개 모두 /actuator/health/liveness → UP 확인 (가이드 W3-1)
#   실패하면 컨테이너를 재시작한다. 기동은 startupProbe 가 끝난 뒤부터 검사하므로 느린 기동과 무관
#   ★ /actuator/health 를 쓰지 않는 이유: DB 상태까지 포함 → DB 가 잠깐 느려지면 모든 Pod 가 동시에 재시작됨
#   관리 포트가 없는 서비스(프론트)는 자기 values 에서 livenessProbe: null
livenessProbe:
  httpGet:
    path: /actuator/health/liveness   # 프로세스가 살아 있나만 봄 (DB 와 무관)
    port: management
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3                 # 30초 연속 실패 시 재시작

# ── Service ──────────────────────────────────────────────────
service:
  type: ClusterIP
  port: null                  # null 이면 containerPort 와 같은 번호 (샘플 앱 규칙: product-service:8086)

# ── HPA ──────────────────────────────────────────────────────
autoscaling:
  enabled: false              # 기본은 끔. 트래픽 시나리오 서비스만 values 에서 켠다
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      # 1분에 1개씩 줄인다 (예전: 1분에 절반). 4→2 를 한 번에 줄이면
      #   남는 2개가 한 노드에 몰릴 수 있고(T-14), 갑자기 절반이 빠져 남은 Pod 에 부하가 몰린다
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# ── KEDA (Cron 사전 확장) ────────────────────────────────────
# 착수보고서: "선착순 쿠폰 서비스는 KEDA 의 Cron 트리거로 쿠폰 오픈 시간 전에 미리 확장"
# 켜면 hpa.yaml 대신 scaledobject.yaml 이 만들어진다.
keda:
  enabled: false
  minReplicaCount: 2            # 평소 Pod 수 (무중단을 위해 2)
  maxReplicaCount: 4            # 최대 Pod 수
  timezone: Asia/Seoul
  # 시간대가 끝난 뒤 4→2 로 줄어드는 속도는 KEDA 가 만든 HPA 의 기본 축소 대기(약 5분)를 따른다.
  # (KEDA 의 cooldownPeriod 는 0개로 줄일 때만 쓰이므로 최소 2개인 우리 설정에는 필요 없음)
  cron: []
  #  예) 매일 13:55 ~ 14:30 동안 4개로 미리 확장 (쿠폰 오픈 14:00 가정)
  #  - { start: "55 13 * * *", end: "30 14 * * *", desiredReplicas: 4 }

# ── PDB ──────────────────────────────────────────────────────
# 켜도 "최소 Pod 수가 2 이상"일 때만 실제로 만들어진다 (1개일 때 만들면 노드 점검이 막힘)
pdb:
  enabled: true
  minAvailable: 1
