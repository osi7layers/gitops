{{- /*
service.yaml : 다른 서비스가 부르는 고정 주소
 - 샘플 앱 규칙: http://<서비스이름>:<앱포트>  (예: http://product-service:8086)
 - management 포트(9000)도 열어 둔다 → 6번이 Prometheus 로 /actuator/prometheus 수집
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "msa-service.fullname" . }}
  labels:
    {{- include "msa-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "msa-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port | default .Values.containerPort }}
      targetPort: http
      protocol: TCP
    {{- if .Values.managementPort }}
    - name: management
      port: {{ .Values.managementPort }}
      targetPort: management
      protocol: TCP
    {{- end }}
