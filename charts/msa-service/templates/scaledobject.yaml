{{- /*
scaledobject.yaml : KEDA 설정 (착수보고서 2.4, WBS 6.3 — 쿠폰 서비스)
 - KEDA 가 이 설정을 읽고 HPA 를 대신 만든다. 그래서 KEDA 를 켜면 hpa.yaml 은 만들어지지 않는다.
 - Cron 트리거: 정해진 시간대(쿠폰 오픈 전 ~ 이벤트 종료)에 Pod 를 desiredReplicas 개로 "미리" 늘린다.
 - 시간대 밖에서는 minReplicaCount 로 돌아간다.
 - 클러스터에 KEDA 본체가 설치돼 있어야 한다 (keda.sh/v1alpha1 CRD).
*/ -}}
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "msa-service.fullname" . }}
  labels:
    {{- include "msa-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:               # rollout.enabled=true 면 Rollout, 아니면 Deployment (_helpers.tpl)
    {{- include "msa-service.scaleTargetRef" . | nindent 4 }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  triggers:
    {{- range .Values.keda.cron }}
    - type: cron
      metadata:
        timezone: {{ $.Values.keda.timezone | quote }}
        start: {{ .start | quote }}           # 이 시각부터
        end: {{ .end | quote }}               # 이 시각까지
        desiredReplicas: {{ .desiredReplicas | quote }}
    {{- end }}
{{- end }}
