# web / aws-main : AWS 클러스터 (ECR 에서 Pull)
# 승급 PR로 직접 newTag를 apps/<서비스>/overlays/onprem-main의 images.newTag 값으로 갱신한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-main
resources:
  - ../../base
  - hpa.yaml
images:
  - name: ecommerce/web
    newName: 918633123181.dkr.ecr.ap-northeast-2.amazonaws.com/ecommerce/web   # 팀 gitops 값
    newTag: "e20a9dd"
# EKS는 노드 IAM 역할로 ECR에서 이미지를 받으므로 base의 harbor-pull Secret을 쓰지 않는다
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: remove
        path: /spec/replicas
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/path
        value: /api/health
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /api/health
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
        value: 6
