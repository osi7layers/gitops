# redis-cache / aws-main
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-main
resources:
  - ../../base
# Docker Hub 대신 AWS 공개 저장소(ECR Public)의 같은 공식 이미지 → 받기 횟수 제한 회피
images:
  - name: redis
    newName: public.ecr.aws/docker/library/redis
    newTag: 7.4-alpine
