# onprem-dev : 개발 네임스페이스가 onprem-main과 같은 Gateway를 쓰므로 호스트명을 분리한다.
# 개발 도메인: shop.dev / api.dev / keycloak.dev.osi7.shop (*.dev.osi7.shop → edge-proxy)
# 도메인을 바꿀 때는 ecommerce-config(Keycloak 주소), auth(SSO 주소), Keycloak redirect URI도 함께 바꾼다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: frontend
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: shop.dev.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: api
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: api.dev.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: product-service
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: api.dev.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: keycloak.dev.osi7.shop
  - target:
      group: apisix.apache.org
      version: v1alpha1
      kind: PluginConfig
      name: ecommerce-oidc
    patch: |-
      - op: replace
        path: /spec/plugins/0/config/discovery
        value: http://keycloak.ecommerce-dev.svc.cluster.local:8080/realms/ecommerce/.well-known/openid-configuration
  # auth 사용자 IP 고정 해제 (11/03): 로그인 중간값은 앱 #45(10/21)부터 DB(sso_handshake)에 저장 → 고정 불필요.
  #  온프렘은 APISIX가 XFF를 믿지 않아(trusted_addresses 127.0.0.1) 전원이 edge-proxy IP 하나로 해시돼 auth 1개에 몰렸음.
  - target:
      group: apisix.apache.org
      version: v1alpha1
      kind: BackendTrafficPolicy
      name: auth-service-timeout
    patch: |-
      - op: remove
        path: /spec/loadbalancer
