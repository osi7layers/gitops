# aws-main : 운영 도메인 (v7.3.19 · 4번) — Route 53 가중치로 온프렘과 같은 도메인을 나눠 받음
#  shop.osi7.shop / api.osi7.shop (온프렘 main 과 같은 값)
#  TODO(1번): Keycloak 을 온프렘 것 하나로 같이 쓰는지(issuer) 확정 후
#   - 같이 쓰면: AWS 에는 keycloak Service 가 없음 → keycloak 경로는 AWS 에서 빼거나 온프렘으로 넘기고,
#                ecommerce-oidc 의 discovery 를 https://keycloak.osi7.shop/realms/ecommerce/.well-known/openid-configuration 로 바꾼다
#  ★ web 이미지에는 API 주소가 빌드 때 박힌다 → https://api.osi7.shop 으로 빌드한 이미지여야 함 (5번)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# (v7.3.18) 이전 중 쿠폰 발급 경로를 온프렘으로 고정 — 전체 서비스 기준 1인 1장 · 수량 한 곳 (켤 때 주석 해제, kube-test 검증 완료 T-13)
# components:
#   - ../../../../components/coupon-pin-onprem
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: frontend
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: shop.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: api
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: api.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: product-service
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: api.osi7.shop
