# aws-main : 운영 도메인 (4번) — Route 53 가중치로 온프렘과 같은 도메인을 나눠 받음
#  shop.osi7.shop / api.osi7.shop (온프렘 main 과 같은 값)
#  Keycloak: AWS 는 온프렘 운영 Keycloak 을 바깥 주소(keycloak.osi7.shop)로 같이 쓴다 (2026-10-26)
#   - AWS 에는 keycloak Service 가 없으므로 keycloak HTTPRoute 는 아래 patch 로 뺀다
#   - ecommerce-oidc 의 discovery 도 바깥 주소로 바꾼다
#  web 이미지는 API 주소를 접속한 도메인 기준으로 실행 중에 만든다 → dev·main·AWS 같은 이미지 사용 가능 (재빌드 불필요, 10/23 확인)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# 이전 중 쿠폰 발급 경로를 온프렘으로 고정 — 전체 서비스 기준 1인 1장 · 수량 한 곳 (켤 때 주석 해제, kube-test 검증 완료)
# components:
#   - ../../../../components/coupon-pin-onprem
patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: frontend
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: shop.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: api
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: api.osi7.shop
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: product-service
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: api.osi7.shop
  # AWS에는 keycloak Service가 없다 (keycloak.osi7.shop 은 온프렘 전용 레코드) → keycloak 라우트는 만들지 않는다
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: keycloak
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: keycloak
  # 로그인 검사(OIDC)는 온프렘 Keycloak 바깥 주소에서 설정을 받는다
  - target:
      group: apisix.apache.org
      version: v1alpha1
      kind: PluginConfig
      name: ecommerce-oidc
    patch: |-
      - op: replace
        path: /spec/plugins/0/config/discovery
        value: https://keycloak.osi7.shop/realms/ecommerce/.well-known/openid-configuration
