# 쿠폰 Redis 1개 (StatefulSet) — 쿠폰 수량·발급자·발급 큐 (유실 금지)
#  1개인 이유: 그냥 늘리면 서로 데이터를 나누지 않는 "다른 Redis 여러 개"가 됨 → 복제는 Sentinel 필요(범위 밖, 한계로 기록)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-coupon
  labels:
    app: redis-coupon
    app.kubernetes.io/name: redis-coupon
    app.kubernetes.io/component: coupon-store
    app.kubernetes.io/part-of: ecommerce
spec:
  serviceName: redis-coupon
  replicas: 1
  selector:
    matchLabels:
      app: redis-coupon
  template:
    metadata:
      labels:
        app: redis-coupon
        app.kubernetes.io/name: redis-coupon
        app.kubernetes.io/component: coupon-store
        app.kubernetes.io/part-of: ecommerce
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999            # 공식 redis(alpine) 이미지의 redis 사용자 (uid 999 · gid 1000)
        runAsGroup: 1000
        fsGroup: 1000             # /data 를 redis 가 쓸 수 있게
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server"]
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            # AOF: 모든 쓰기를 바로 디스크에 기록 (everysec 는 장애 시 최근 1초 유실 가능 → always · 리뷰 반영)
            #  느려지는 만큼은 부하 테스트로 확인. 너무 느리면 everysec + 복구 후 검증으로 낮춘다
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            # RDB 스냅샷도 남김 (백업 파일용: 15분에 1건 이상 바뀌면 저장)
            - --save
            - "900 1"
            # 메모리가 차면 아무것도 지우지 않고 쓰기를 거부 → 쿠폰 데이터 보호 (앱은 "잠시 후 다시 시도")
            #  ★ 실제 사용량은 부하 테스트로 측정해서 maxmemory·메모리 상한을 조정
            - --maxmemory
            - 400mb
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-coupon-secret
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH          # redis-cli 가 비밀번호를 경고 없이 쓰게 함 (Probe·점검용)
              valueFrom:
                secretKeyRef:
                  name: redis-coupon-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi       # 요청=상한 (다른 앱과 같은 규칙)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  # 디스크 요청서 (StorageClass 는 클러스터 기본값: 온프렘 local-path / AWS gp3 — EBS CSI 필요)
  #  ※ volumeClaimTemplates 는 나중에 못 바꿈 → 크기를 바꾸려면 StatefulSet 을 지우고 다시 만들어야 함
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: redis-coupon
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
