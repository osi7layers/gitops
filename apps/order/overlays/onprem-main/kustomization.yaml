# order / onprem-main : 온프레미스 클러스터 (Harbor 에서 Pull)
# 승급 PR로 직접 newTag를 apps/<서비스>/overlays/onprem-dev의 images.newTag 값으로 갱신한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-main
resources:
  - ../../base
images:
  - name: ecommerce/order
    newName: harbor.osi7.shop/ecommerce/order   # 팀 gitops 값
    newTag: "52cf7f7"
patches:
  - path: otel-tracing-patch.json
  - path: memory-patch.yaml   # 메모리 768Mi (11/03, dev #65 확인 뒤)

# 분산 계산에서 taint 노드 제외 (dev #62에서 확인한 것과 같음)
components:
  - ../../../../components/spread-honor
