# order / onprem-dev : 온프레미스 클러스터 (Harbor 에서 Pull)
#  이미지 태그는 5번 Jenkins 가 아래 명령으로 바꾼다:
#    kustomize edit set image ecommerce/order=<레지스트리>/<이미지>:<태그>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-dev
resources:
  - ../../base
images:
  - name: ecommerce/order
    newName: harbor.osi7.shop/ecommerce/order   # 팀 gitops 값
    newTag: "52cf7f7"
patches:
  - path: otel-tracing-patch.json
