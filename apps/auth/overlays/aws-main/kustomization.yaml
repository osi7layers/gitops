# auth / aws-main : AWS 클러스터 (ECR 에서 Pull)
#  이미지 태그는 5번 Jenkins 가 아래 명령으로 바꾼다:
#    kustomize edit set image ecommerce/auth=<레지스트리>/<이미지>:<태그>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-main
resources:
  - ../../base
images:
  - name: ecommerce/auth
    newName: 918633123181.dkr.ecr.ap-northeast-2.amazonaws.com/ecommerce/auth   # 팀 gitops 값
    newTag: 018ab62   # Jenkins 가 관리 (dev 자동 · 운영은 승급 PR) — 사람이 고치지 않음

# (4번) 운영 로그인 콜백 주소 — 2번이 운영 Keycloak redirect URI 에 등록함 (2026-10-22)
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: auth-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-service
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: SSO_BACKEND_CALLBACK_URL
                    value: "https://api.osi7.shop/api/v1/auth/callback"
                  - name: SSO_DEFAULT_FRONTEND_REDIRECT
                    value: "https://shop.osi7.shop/auth/callback"
                  - name: SSO_ALLOWED_REDIRECT_URIS
                    value: "https://shop.osi7.shop/auth/callback"
