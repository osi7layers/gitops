# ═════════════════════════════════════════════════════════════
# promotion-service  —  쿠폰·프로모션 ★ 2순위 선착순 쿠폰 시나리오 (KEDA Cron)
#  차트 기본값(charts/msa-service/values.yaml)과 다른 것만 적는다.
#  값의 출처: 샘플 저장소 k8s/backend/promotion-service.yaml (Kafka 대기는 제외)
# ═════════════════════════════════════════════════════════════
image:
  repository: ecommerce/promotion   # 이미지 이름. 실제 주소·태그는 overlays/<환경> 에서 교체 (Jenkins 는 이 이름으로 찾음)
  tag: "latest"
# Harbor(온프렘) 이미지 Pull 인증 — Secret harbor-pull 은 Git 밖, 2번이 ecommerce-dev·ecommerce-main 에 생성 (robot$ecommerce+pull)
#  aws-main(ECR)은 노드 IAM 역할로 받으므로 이 Secret 이 없어도 정상 (없다는 경고만 남음)
imagePullSecrets:
  - name: harbor-pull

containerPort: 8093         # 다른 서비스와 게이트웨이(APISIX)가 promotion-service:8093 로 호출

# 앱 시작 전에 열려 있어야 하는 의존 서비스 (열릴 때까지 initContainer 가 대기)
waitFor:
  - { name: db, hostEnv: DB_HOST, portEnv: DB_PORT }   # DB(MySQL) 주소는 ecommerce-config 를 따라감

env:
  # ── DB 연결 (착수보고서 261012: MySQL) ──
  #  주소·종류는 공통 설정(ecommerce-config)의 DB_* 를 끼워 넣는다 → DB 가 바뀌어도 ecommerce-config 만 고치면 됨
  #  SPRING_DATASOURCE_* 는 앱 application.yml 의 값을 덮어쓴다 (앱의 POSTGRES_* 변수 이름과 무관하게 동작)
  #  ★ 앱 이미지에 MySQL 드라이버가 들어 있어야 함 (샘플 앱은 PostgreSQL 전용 → 앱 담당 수정 필요)
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:$(DB_JDBC_SCHEME)://$(DB_HOST):$(DB_PORT)/promotionservice$(DB_NAME_SUFFIX)"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "$(DB_DRIVER)"
  - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
    value: "$(DB_DIALECT)"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_PASSWORD
  # 로그인 토큰 확인: 서명 키는 클러스터 내부 주소에서 받고, iss 는 JWT_ISSUER_URI(공개 주소)와 비교
  - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
    value: "$(KEYCLOAK_JWK_SET_URI)"
  # ── Redis (선착순 쿠폰 재고) ──
  #  (4번) 비밀번호는 redis-coupon-secret 에서 읽는다 (예전 redis-secret → 4번 Redis 로 전환).
  #  Secret 이 없는 환경(aws-main)에서도 Pod 가 뜨도록 optional
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-coupon-secret
        key: REDIS_PASSWORD
        optional: true

# ── 스케일링: KEDA Cron (착수보고서 2.4 "쿠폰은 KEDA 의 Cron 트리거로 쿠폰 오픈 전 미리 확장") ──
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 4
  cron:
    # 쿠폰 오픈 시각 5분 전부터 이벤트 종료까지 4개로 미리 확장
    # ★ 부하 테스트(7번) 일정이 정해지면 이 시간을 테스트 시각으로 바꿔서 커밋
    - { start: "55 13 * * *", end: "30 14 * * *", desiredReplicas: 4 }
