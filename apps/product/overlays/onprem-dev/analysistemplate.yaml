# product 카나리 분석 : 카나리 Pod 의 5xx 비율을 Prometheus 에서 재서 승급(다음 단계)과 롤백을 자동으로 정한다
#  Rollout steps 의 analysis 단계가 이 템플릿으로 AnalysisRun 을 만든다 (kustomization.yaml patches 참고)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: product-error-rate
spec:
  args:
    - name: namespace      # Rollout 이 있는 네임스페이스 (Rollout 에서 넘겨줌)
    - name: canary-hash    # 카나리 Pod 의 rollouts-pod-template-hash 값 (Prometheus 라벨 rollout_hash)
  metrics:
    - name: error-rate
      initialDelay: 1m     # 카나리 Pod 지표가 1분 범위를 채울 때까지 기다린 뒤 첫 측정
      interval: 30s        # 30초마다 측정
      count: 4             # 4번 측정 (약 2분)
      failureLimit: 0      # 실패 기준을 한 번이라도 넘으면 분석 실패, Rollout 이 롤백한다
      # 요청이 있으면 5xx 비율 5% 미만일 때 성공, 5% 이상이면 실패
      # 요청이 없으면 결과가 비어 성공도 실패도 아님(Inconclusive) : Rollout 이 멈추고 사람이 판단한다
      successCondition: len(result) > 0 && result[0] < 0.05
      failureCondition: len(result) > 0 && result[0] >= 0.05
      provider:
        prometheus:
          address: http://10.0.1.112:9090   # mon-01 Prometheus
          # 5xx 요청 수 / 전체 요청 수 (헬스 체크·지표 수집 경로 /actuator 는 제외)
          #  5xx 가 없으면 or vector(0) 으로 0 을 채우고, 전체 요청이 0 이면 > 0 이 결과를 비운다
          query: |
            (
              sum(rate(http_server_requests_seconds_count{job="product-pods", namespace="{{args.namespace}}", rollout_hash="{{args.canary-hash}}", status=~"5..", uri!~"/actuator.*"}[1m]))
              or vector(0)
            )
            /
            (
              sum(rate(http_server_requests_seconds_count{job="product-pods", namespace="{{args.namespace}}", rollout_hash="{{args.canary-hash}}", uri!~"/actuator.*"}[1m]))
              > 0
            )
