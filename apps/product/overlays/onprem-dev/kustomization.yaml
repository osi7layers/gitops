# product / onprem-dev : 온프레미스 클러스터 (Harbor 에서 Pull)
#  이미지 태그는 5번 Jenkins 가 아래 명령으로 바꾼다:
#    kustomize edit set image ecommerce/product=<레지스트리>/<이미지>:<태그>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-dev
resources:
  - ../../base
  - analysistemplate.yaml   # 카나리 분석 템플릿 (dev 에서 먼저 확인)
images:
  - name: ecommerce/product
    newName: harbor.osi7.shop/ecommerce/product   # 팀 gitops 값
    newTag: "c85867e"
# 카나리 단계 : 사람이 승인하던 pause 대신 분석(analysis)으로 자동 승급·롤백 (dev 에서 먼저 확인)
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: product-service
    patch: |-
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 20
          - analysis:
              templates:
                - templateName: product-error-rate
              args:
                - name: namespace
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: canary-hash
                  valueFrom:
                    podTemplateHashValue: Latest
          - setWeight: 50
          - analysis:
              templates:
                - templateName: product-error-rate
              args:
                - name: namespace
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: canary-hash
                  valueFrom:
                    podTemplateHashValue: Latest
