# product / aws-main : AWS 클러스터 (ECR 에서 Pull)
# 승급 PR로 직접 newTag를 apps/<서비스>/overlays/onprem-main의 images.newTag 값으로 갱신한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-main
resources:
  - ../../base
images:
  - name: ecommerce/product
    newName: 918633123181.dkr.ecr.ap-northeast-2.amazonaws.com/ecommerce/product   # 팀 gitops 값
    newTag: "4aaccf9"
patches:
  - path: patch-hpa.yaml
