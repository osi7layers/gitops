# product / onprem-main : 온프레미스 클러스터 (Harbor 에서 Pull)
# 승급 PR로 직접 newTag를 apps/<서비스>/overlays/onprem-dev의 images.newTag 값으로 갱신한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce-main
resources:
  - ../../base
  - analysistemplate.yaml
images:
  - name: ecommerce/product
    newName: harbor.osi7.shop/ecommerce/product   # 팀 gitops 값
    newTag: "b4a1660"
# 카나리 단계 : 사람이 승인하던 pause 대신 분석(analysis)으로 자동 승급·롤백(dev에서 확인한 것과 같은 설정)
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: product-service
    patch: |-
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 20
          - analysis:
              templates:
                - templateName: product-error-rate
              args:
                - name: namespace
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: canary-hash
                  valueFrom:
                    podTemplateHashValue: Latest
          - setWeight: 50
          - analysis:
              templates:
                - templateName: product-error-rate
              args:
                - name: namespace
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: canary-hash
                  valueFrom:
                    podTemplateHashValue: Latest
