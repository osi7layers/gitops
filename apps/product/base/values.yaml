# ═════════════════════════════════════════════════════════════
# product-service  —  상품: 조회 중심 ★ 1순위 트래픽 시나리오 (HPA) + 카나리 배포 (Rollout)
#  차트 기본값(charts/msa-service/values.yaml)과 다른 것만 적는다.
#  값의 출처: 샘플 저장소 k8s/backend/product-service.yaml (Kafka 대기는 제외)
# ═════════════════════════════════════════════════════════════
image:
  repository: ecommerce/product   # 이미지 이름. 실제 주소·태그는 overlays/<환경> 에서 교체 (Jenkins 는 이 이름으로 찾음)
  tag: "latest"

containerPort: 8086         # 다른 서비스와 게이트웨이(APISIX)가 product-service:8086 로 호출

# 앱 시작 전에 열려 있어야 하는 의존 서비스 (열릴 때까지 initContainer 가 대기)
waitFor:
  - { name: db, hostEnv: DB_HOST, portEnv: DB_PORT }   # DB(MySQL) 주소는 ecommerce-config 를 따라감

env:
  # ── DB 연결 (착수보고서 261012: MySQL) ──
  #  주소·종류는 공통 설정(ecommerce-config)의 DB_* 를 끼워 넣는다 → DB 가 바뀌어도 ecommerce-config 만 고치면 됨
  #  SPRING_DATASOURCE_* 는 앱 application.yml 의 값을 덮어쓴다 (앱의 POSTGRES_* 변수 이름과 무관하게 동작)
  #  ★ 앱 이미지에 MySQL 드라이버가 들어 있어야 함 (샘플 앱은 PostgreSQL 전용 → 앱 담당 수정 필요)
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:$(DB_JDBC_SCHEME)://$(DB_HOST):$(DB_PORT)/productservice$(DB_NAME_SUFFIX)"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "$(DB_DRIVER)"
  - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
    value: "$(DB_DIALECT)"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_USERNAME
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_PASSWORD
  # 로그인 토큰 확인: 서명 키는 클러스터 내부 주소에서 받고, iss 는 JWT_ISSUER_URI(공개 주소)와 비교
  - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
    value: "$(KEYCLOAK_JWK_SET_URI)"

# ── 스케일링: HPA (착수보고서 2.4 "상품 조회 서비스는 CPU 기준의 HPA") ──
autoscaling:
  enabled: true
  minReplicas: 2       # 무중단을 위해 최소 2개
  maxReplicas: 4       # 온프렘 노드 사양 기준. 실측 후 조정 (WBS W2-3)
  targetCPUUtilizationPercentage: 70

# ── 배포 방식: 카나리 (팀 결정 "product 만 Rollout, 나머지는 기본 Deployment") ──
#  Deployment 대신 Rollout 이 만들어지고, HPA 대상도 Rollout 으로 자동 전환된다.
#  요청 비율은 HTTPRoute product-service(apps/gateway-routes)의 stable/canary weight 로 나눈다.
#  카나리 단계(steps)는 차트 기본값 사용: 20% → 승인 대기 → 50% → 2분 → 100%  (5번 확정 후 여기서 덮어씀)
rollout:
  enabled: true
  httpRoute: product-service
