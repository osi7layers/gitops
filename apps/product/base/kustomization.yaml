# product-service base : 공통 차트(charts/msa-service) + values.yaml → 이 서비스의 기본 YAML
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: ../../../charts
helmCharts:
  - name: msa-service
    releaseName: product-service        # = 리소스 이름 = 서비스 주소
    namespace: ecommerce-main
    valuesFile: values.yaml
