# ═════════════════════════════════════════════════════════════
# ecommerce-config : 백엔드 4개가 같이 쓰는 공통 설정 (4번 담당: ConfigMap)
#  - 출처: 샘플 저장소 k8s/configmap.yaml
#  - 값은 config.env 에 KEY=VALUE 로 적는다.
#  - configMapGenerator 를 쓰면 이름 뒤에 내용 해시가 붙는다 (예: ecommerce-config-7h2k9m)
#    → 값이 바뀌면 이름이 바뀌고 → 이걸 참조하는 모든 Deployment 가 자동으로 롤링 재시작된다.
#    (해시 없는 일반 ConfigMap 은 값을 바꿔도 이미 뜬 Pod 에 반영되지 않음)
# ═════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: ecommerce-config
    envs:
      - config.env
