# ═════════════════════════════════════════════════════════════
# ecommerce-config : 백엔드 4개가 같이 쓰는 공통 설정 (4번 담당: ConfigMap)
#  - 출처: 샘플 저장소 k8s/configmap.yaml
#  - 값은 config.env 에 KEY=VALUE 로 적는다.
#  - 해시는 끈다(generatorOptions): 백엔드는 각자 따로 배포되며 이름 "ecommerce-config"로 찾기 때문
#  - 값을 바꾸면 Pod가 자동으로 재시작되지 않으므로, 머지 후 kubectl rollout restart로 재시작한다
# ═════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: ecommerce-config
    envs:
      - config.env
generatorOptions:
  disableNameSuffixHash: true
