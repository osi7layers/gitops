# aws-main : AWS 클러스터 (EKS)
#  ★ 261008: RDS 없음. DB 는 온프렘에 계속 유지 → AWS 앱은 온프렘 DB 에 접속한다.
#  ★ 샘플 앱은 서비스당 DB 주소가 1개라 읽기/쓰기 분리 불가 (주소 하나만 사용)
#  (4번) DB: edge-proxy 공인 IP 132.145.89.131:6450 → 온프렘 Router 로 포워딩 (2번 · 2026-10-22)
#  Redis: AWS 에는 redis-coupon 이 없음 (쿠폰 경로 온프렘 고정). base 의 REDIS_HOST=redis-coupon 은 연결 실패 →
#         promotion 은 health UP 유지, 쿠폰 목록은 DB 값, 발급만 503 (2번 확인) — 초과 발급 대신 실패하는 안전한 쪽
#  Keycloak: AWS 에는 Keycloak 이 없어서 온프렘 운영 Keycloak 을 바깥 주소(keycloak.osi7.shop)로 같이 쓴다 (2026-10-26)
#            issuer 가 onprem-main 과 같아야 가중치 전환 중에도 온프렘에서 받은 토큰을 AWS 앱이 받아 준다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: ecommerce-config
    behavior: merge
    literals:
      - DB_HOST=132.145.89.131
      # auth 가 시작 전에 열릴 때까지 기다리는 주소 (바깥 주소는 HTTPS 라 443)
      - KEYCLOAK_HOST=keycloak.osi7.shop
      - KEYCLOAK_PORT=443
      - KEYCLOAK_SERVER_URL=https://keycloak.osi7.shop
      - KEYCLOAK_PUBLIC_SERVER_URL=https://keycloak.osi7.shop
      - KEYCLOAK_JWK_SET_URI=https://keycloak.osi7.shop/realms/ecommerce/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=https://keycloak.osi7.shop/realms/ecommerce
      - JWT_ISSUER_URI=https://keycloak.osi7.shop/realms/ecommerce
      