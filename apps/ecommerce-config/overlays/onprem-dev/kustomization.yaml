# onprem-dev : 온프레미스 클러스터
#  DB : MySQL Router 10.0.1.111:6450 (8번 확정). 개발·운영은 같은 서버, DB 와 계정을 따로 씀
#       → 개발은 DB 이름 뒤에 _dev (예: productservice_dev), 계정은 namespace 별 db-secret
#  Redis : 4번 redis-coupon (같은 namespace 안 Service 이름, base 값 그대로)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: ecommerce-config
    behavior: merge          # base 값은 두고 아래 key 만 덮어쓰기
    literals:
      - DB_HOST=10.0.1.111
      - DB_NAME_SUFFIX=_dev             # 개발 전용 DB(<서비스>_dev) 사용. ★ 8번이 만든 이름 규칙과 같아야 함
      - KEYCLOAK_PUBLIC_SERVER_URL=https://keycloak.dev.osi7.shop
      - KEYCLOAK_ISSUER_URI=https://keycloak.dev.osi7.shop/realms/ecommerce
      - JWT_ISSUER_URI=https://keycloak.dev.osi7.shop/realms/ecommerce # 개발 Keycloak의 KC_HOSTNAME과 같아야 함
      - PROMOTION_ISSUE_STORE=redis-async
