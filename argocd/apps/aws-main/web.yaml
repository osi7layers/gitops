apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-aws-main
  namespace: argocd
  annotations:
    # sync 실패, Degraded일 때 Slack(slack-webhook)으로 알림
    notifications.argoproj.io/subscribe.on-sync-failed.slack-webhook: ""
    notifications.argoproj.io/subscribe.on-health-degraded.slack-webhook: ""
spec:
  destination:
    name: osi7-aws
    namespace: ecommerce-main
  project: default
  source:
    path: apps/web/overlays/aws-main
    repoURL: https://github.com/osi7layers/gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
