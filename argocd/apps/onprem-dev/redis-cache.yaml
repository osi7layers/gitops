apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-cache-onprem-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/osi7layers/gitops.git
    targetRevision: main
    path: apps/redis-cache/overlays/onprem-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
