apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-onprem-dev
  namespace: argocd
  annotations:
    # sync 실패, Degraded일 때 Slack(slack-webhook)으로 알림
    notifications.argoproj.io/subscribe.on-sync-failed.slack-webhook: ""
    notifications.argoproj.io/subscribe.on-health-degraded.slack-webhook: ""
spec:
  project: default
  source:
    repoURL: https://github.com/osi7layers/gitops.git
    targetRevision: main
    path: apps/order/overlays/onprem-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
