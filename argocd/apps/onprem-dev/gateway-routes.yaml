apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-routes-onprem-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/osi7layers/gitops.git
    targetRevision: main
    path: apps/gateway-routes/overlays/onprem-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-dev
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: product-service
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
