apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-onprem-main
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/osi7layers/gitops.git
    targetRevision: main
    path: apps/order/overlays/onprem-main
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
