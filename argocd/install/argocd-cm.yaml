# 공식 매니페스트의 argocd-cm에 우리 설정을 덮는다.
# data 안의 값은 문자열 하나라서, 키를 적으면 그 키의 값 전체가 이 파일 내용으로 바뀐다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # overlay(Kustomize)가 바깥에서 Helm 차트(charts/msa-service)를 펼치기 위해 필요하다
  kustomize.buildOptions: --enable-helm

  # 공식 기본값과 같고, 맨 위 항목에만 clusters 2줄을 더했다.
  # EndpointSlice를 무시하는 것을 온프레미스 클러스터(in-cluster)로 한정해서,
  # osi7-aws의 coupon-onprem EndpointSlice는 Argo CD가 관리하게 한다 (gitops #35).
  resource.exclusions: |
    ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
      clusters:
      - https://kubernetes.default.svc
    ### Internal Kubernetes resources excluded reduce the number of watched events
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched events
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
