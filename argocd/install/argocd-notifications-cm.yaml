# Argo CD Notifications: 문제가 있을 때만 Slack #deploy로 알린다 (sync 실패, Degraded).
# Slack 주소는 argocd-notifications-secret의 slack-url 키에 있고, 여기서는 $slack-url로 가리키기만 한다.
# Application에는 notifications.argoproj.io/subscribe.on-sync-failed.slack-webhook 같은 annotation을 붙여 구독한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
data:
  # 알림 본문의 링크 주소. UI는 cp-01 터널 + port-forward(8081)로 연다
  context: |
    argocdUrl: https://localhost:8081
  service.webhook.slack-webhook: |
    url: $slack-url
    headers:
      - name: Content-Type
        value: application/json
  template.app-health-degraded: |
    webhook:
      slack-webhook:
        method: POST
        body: |
          {"text": ":warning: Argo CD 앱 Degraded: {{.app.metadata.name}}\n리비전 {{.app.status.sync.revision}}\n{{.context.argocdUrl}}/applications/argocd/{{.app.metadata.name}}"}
  template.app-sync-failed: |
    webhook:
      slack-webhook:
        method: POST
        body: |
          {"text": ":x: Argo CD sync 실패: {{.app.metadata.name}} ({{.app.status.operationState.phase}})\n리비전 {{.app.status.sync.revision}}\n{{.context.argocdUrl}}/applications/argocd/{{.app.metadata.name}}"}
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
  trigger.on-sync-failed: |
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
