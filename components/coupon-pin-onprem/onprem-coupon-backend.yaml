# 온프렘 입구를 클러스터 안 Service 처럼 보이게 함 (selector 없는 Service + 외부 IP 의 EndpointSlice)
apiVersion: v1
kind: Service
metadata:
  name: coupon-onprem
  labels:
    app.kubernetes.io/part-of: ecommerce
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: coupon-onprem-1
  labels:
    kubernetes.io/service-name: coupon-onprem
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - "132.145.89.131"        # 온프렘 edge-proxy 공인 IP (2번 확인 · 바뀌면 여기만 수정)
---
# APISIX → 온프렘은 HTTPS, Host 는 api.osi7.shop (온프렘 기존 HTTPRoute·인증서와 맞춤)
apiVersion: apisix.apache.org/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: coupon-onprem
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: coupon-onprem
  scheme: https
  passHost: rewrite
  upstreamHost: api.osi7.shop
  timeout:
    connect: 5s
    send: 30s
    read: 30s
